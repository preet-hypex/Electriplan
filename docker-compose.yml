name: loginpage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: loginpage-api:local
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_DB_URL: jdbc:postgresql://db:5432/app
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  floorplan:
    build: ./floorplan
    image: loginpage-floorplan:local
    volumes:
      - floorplan-uploads:/data/uploads
    ports:
      - "127.0.0.1:${FLOORPLAN_PORT:-8082}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/floorplan/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  web:
    build: ./frontend
    image: loginpage-web:local
    depends_on:
      api:
        condition: service_healthy
      floorplan:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-4180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  app-data:
  floorplan-uploads:
