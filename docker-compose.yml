name: electriplan

services:
  db:
    image: postgres:17-alpine
    # Local development credentials. Connections from outside the container
    # (the API, DBeaver) need the password; port 5433 is bound to this machine only.
    environment:
      POSTGRES_DB: ${DB_NAME:-electriplan}
      POSTGRES_USER: ${DB_USER:-electriplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-electriplan}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Creates (or updates) electriplan_api, the login the API connects as, before
  # the API starts. Runs on every `up`, so existing databases get it too.
  db-roles:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-electriplan}
      PGUSER: ${DB_USER:-electriplan}
      PGPASSWORD: ${DB_PASSWORD:-electriplan}
      API_DB_PASSWORD: ${DB_API_PASSWORD:-electriplan_api}
    volumes:
      - ./infra/postgres/application-login.sql:/application-login.sql:ro
    entrypoint: ["sh", "-c", "psql -q -v api_password=\"$$API_DB_PASSWORD\" -f /application-login.sql"]
    restart: "no"

  api:
    build:
      context: ./backend
      # The JSON Schemas the API packages (see backend/Dockerfile).
      additional_contexts:
        contracts: ./contracts
    image: electriplan-api:local
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-electriplan}
      # The API works as electriplan_api; Flyway migrates as the owner.
      APP_DB_USER: electriplan_api
      APP_DB_PASSWORD: ${DB_API_PASSWORD:-electriplan_api}
      APP_DB_OWNER_USER: ${DB_USER:-electriplan}
      APP_DB_OWNER_PASSWORD: ${DB_PASSWORD:-electriplan}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  floorplan:
    build: ./floorplan
    image: electriplan-floorplan:local
    # Only the public project URL, to verify sign-ins against the project's
    # public keys. The analyser never sees the secret key in backend/.env.
    env_file:
      - path: ./frontend/.env
        required: false
    volumes:
      - floorplan-uploads:/data/uploads
    ports:
      - "127.0.0.1:${FLOORPLAN_PORT:-8082}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/floorplan/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  web:
    build: ./frontend
    image: electriplan-web:local
    depends_on:
      api:
        condition: service_healthy
      floorplan:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-4180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  app-data:
  floorplan-uploads:
