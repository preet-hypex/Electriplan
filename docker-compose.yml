name: electriplan

services:
  db:
    image: postgres:17-alpine
    # Local development credentials. Connections from outside the container
    # (the API, DBeaver) need the password; port 5433 is bound to this machine only.
    environment:
      POSTGRES_DB: ${DB_NAME:-electriplan}
      POSTGRES_USER: ${DB_USER:-electriplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-electriplan}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Creates (or updates) electriplan_api, the login the API connects as, before
  # the API starts. Runs on every `up`, so existing databases get it too.
  db-roles:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-electriplan}
      PGUSER: ${DB_USER:-electriplan}
      PGPASSWORD: ${DB_PASSWORD:-electriplan}
      API_DB_PASSWORD: ${DB_API_PASSWORD:-electriplan_api}
    volumes:
      - ./infra/postgres/application-login.sql:/application-login.sql:ro
    entrypoint: ["sh", "-c", "psql -q -v api_password=\"$$API_DB_PASSWORD\" -f /application-login.sql"]
    restart: "no"

  api:
    build:
      context: ./backend
      # The JSON Schemas the API packages (see backend/Dockerfile).
      additional_contexts:
        contracts: ./contracts
    image: electriplan-api:local
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-electriplan}
      # The API works as electriplan_api; Flyway migrates as the owner.
      APP_DB_USER: electriplan_api
      APP_DB_PASSWORD: ${DB_API_PASSWORD:-electriplan_api}
      APP_DB_OWNER_USER: ${DB_USER:-electriplan}
      APP_DB_OWNER_PASSWORD: ${DB_PASSWORD:-electriplan}
      PORT: "8080"
      # Local development designs states whose rules are not signed off yet (Victoria, until E16-S4).
      RULES_ALLOW_UNSIGNED_STATES: ${RULES_ALLOW_UNSIGNED_STATES:-true}
      # Files go to S3: locally the "s3" service below, which takes any key.
      FILES_S3_ENDPOINT: http://s3:9090
      FILES_S3_BUCKET: electriplan-files
      FILES_S3_ACCESS_KEY: local
      FILES_S3_SECRET_KEY: local
      # The floor-plan analyser, which the API calls with each house upload.
      ANALYSER_URL: http://floorplan:8000
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      s3:
        condition: service_started
      floorplan:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  floorplan:
    build: ./floorplan
    image: electriplan-floorplan:local
    # Only the public project URL, to verify sign-ins against the project's
    # public keys. The analyser never sees the secret key in backend/.env.
    env_file:
      - path: ./frontend/.env
        required: false
    # It only analyses: it keeps no files (the API stores uploads in S3).
    ports:
      - "127.0.0.1:${FLOORPLAN_PORT:-8082}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/floorplan/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  # S3 for local development: an S3-compatible store (Adobe's open-source
  # S3Mock) with the bucket made at start. Files are kept in the s3-files
  # volume. In AWS the API uses a real bucket instead (README "File storage").
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: electriplan-files
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    volumes:
      - s3-files:/s3mockroot
    ports:
      - "127.0.0.1:${S3_PORT:-9090}:9090"
    restart: unless-stopped

  web:
    build: ./frontend
    image: electriplan-web:local
    depends_on:
      api:
        condition: service_healthy
      floorplan:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-4180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  app-data:
  s3-files:
