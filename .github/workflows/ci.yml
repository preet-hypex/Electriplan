# Builds and tests every part of the app on each pull request into main, and on
# each push to main. "CI passed" is the one check to require before merging:
# it passes only when every other job has.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch or PR makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The FloorPlan types the editor uses are generated too; `npm test` then
      # checks what the editor builds and parses against the schema.
      - name: Contract types are up to date
        run: npm run contracts:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Setup script tests
        working-directory: .
        run: node --test scripts/lib/*.test.mjs

  floorplan:
    name: Floor-plan analyser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floorplan
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: floorplan/requirements.txt
      - run: pip install -r requirements.txt
      # Includes tests/test_contract.py: what the analyser returns is checked
      # against contracts/floor-plan.schema.json.
      - name: Tests
        run: python -m pytest

  api:
    name: API
    runs-on: ubuntu-latest
    # A real Postgres, so the tests that need one (SupabaseUserPostgresTests)
    # run here instead of being skipped. Same image and user as docker-compose.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: electriplan
          POSTGRES_USER: electriplan
          POSTGRES_PASSWORD: electriplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electriplan -d electriplan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_TEST_DB_URL: jdbc:postgresql://localhost:5432/electriplan
      APP_TEST_DB_USER: electriplan
      APP_TEST_DB_PASSWORD: electriplan
      APP_TEST_DB_API_USER: electriplan_api
      APP_TEST_DB_API_PASSWORD: electriplan_api
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create the API's database login
        working-directory: .
        env:
          PGHOST: localhost
          PGUSER: electriplan
          PGPASSWORD: electriplan
          PGDATABASE: electriplan
        run: psql -q -v api_password=electriplan_api -f infra/postgres/application-login.sql
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The web image refuses to build without Supabase settings. Placeholders
      # prove the image builds; real values are only ever set by setup.
      - name: Placeholder frontend/.env
        run: |
          printf 'VITE_SUPABASE_URL=https://ci-placeholder.supabase.co\nVITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder\n' > frontend/.env
      - name: Build all images
        run: docker compose build

  ci-passed:
    name: CI passed
    if: always()
    needs: [frontend, floorplan, api, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A job did not pass." >&2
            exit 1
          fi
