app.supabase.url=https://example.supabase.co
app.supabase.secret-key=sb_secret_test

app.users.sync-enabled=false

spring.datasource.url=jdbc:h2:mem:app;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

# The H2 test database has no schema (Flyway is off), so Hibernate must not
# check one. Mapping checks run against Postgres in DistributorDirectoryPostgresTests.
spring.jpa.hibernate.ddl-auto=none

# set_config is a Postgres function; the H2 test database has no row-level
# security to feed. The Postgres tests turn this back on.
electriplan.tenancy.session-settings=false

# The same API description settings as the running API.
spring.config.import=classpath:api-docs.properties
