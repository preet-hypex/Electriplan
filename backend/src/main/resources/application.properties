spring.application.name=electriplan-api
server.port=${PORT:8080}
server.shutdown=graceful

app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:4180}

app.users.sync-enabled=${USER_SYNC_ENABLED:true}
app.users.sync-interval=${USER_SYNC_INTERVAL:PT5M}

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5433/electriplan}
# The API works as electriplan_api (a member of electriplan_app): data access
# only, row-level security always applies. Flyway alone uses the owner, below.
spring.datasource.username=${APP_DB_USER:electriplan_api}
spring.datasource.password=${APP_DB_PASSWORD:electriplan_api}
spring.datasource.hikari.pool-name=electriplan
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Migrations run as the owner of the schema, the only role that may change it.
spring.flyway.user=${APP_DB_OWNER_USER:electriplan}
spring.flyway.password=${APP_DB_OWNER_PASSWORD:electriplan}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=electriplan
spring.flyway.default-schema=electriplan
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,modulith

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

server.error.include-message=always

# Hibernate (Spring Data JPA). Flyway owns the schema; Hibernate only checks
# that every entity matches the table it maps, and refuses to start if not.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=electriplan

# The rule pack the engine designs with (src/main/resources/rulepacks/<pack>).
# It designs only states whose rules a licensed electrician has signed off.
# RULES_ALLOW_UNSIGNED_STATES=true also designs states with unsigned rules:
# for development and tests only, never production.
electriplan.rules.pack=${RULES_PACK:au-residential}
electriplan.rules.allow-unsigned-states=${RULES_ALLOW_UNSIGNED_STATES:false}

# The API's description (OpenAPI document and Swagger UI): see api-docs.properties,
# shared with the tests so they check the document the API really serves.
spring.config.import=classpath:api-docs.properties

# Address finder for site addresses (Photon, OpenStreetMap data). The public
# server is for development; production should run its own Photon, or another
# provider, at ADDRESS_FINDER_URL.
electriplan.addresses.url=${ADDRESS_FINDER_URL:https://photon.komoot.io}
electriplan.addresses.enabled=${ADDRESS_FINDER_ENABLED:true}
# The public server can take several seconds per search.
electriplan.addresses.timeout=${ADDRESS_FINDER_TIMEOUT:10s}

# Files (uploaded floor-plan images...) are kept in S3. In AWS: set the bucket
# and region; credentials come from the environment (an IAM role). Locally:
# docker-compose's "s3" service, by endpoint, with any key. README "File storage".
electriplan.files.s3.bucket=${FILES_S3_BUCKET:electriplan-files}
electriplan.files.s3.region=${FILES_S3_REGION:ap-southeast-2}
electriplan.files.s3.endpoint=${FILES_S3_ENDPOINT:}
electriplan.files.s3.access-key=${FILES_S3_ACCESS_KEY:}
electriplan.files.s3.secret-key=${FILES_S3_SECRET_KEY:}
# Images up to 25 MB (the API's own check says so in words; these let it see the upload).
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=27MB

# The floor-plan analyser (Python): it only analyses; the API keeps the image and the plan.
electriplan.analyser.url=${ANALYSER_URL:http://localhost:8082}
electriplan.analyser.timeout=${ANALYSER_TIMEOUT:180s}
