spring.application.name=electriplan-api
server.port=${PORT:8080}
server.shutdown=graceful

app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:4180}

app.users.sync-enabled=${USER_SYNC_ENABLED:true}
app.users.sync-interval=${USER_SYNC_INTERVAL:PT5M}

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5433/electriplan}
# The API works as electriplan_api (a member of electriplan_app): data access
# only, row-level security always applies. Flyway alone uses the owner, below.
spring.datasource.username=${APP_DB_USER:electriplan_api}
spring.datasource.password=${APP_DB_PASSWORD:electriplan_api}
spring.datasource.hikari.pool-name=electriplan
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Migrations run as the owner of the schema, the only role that may change it.
spring.flyway.user=${APP_DB_OWNER_USER:electriplan}
spring.flyway.password=${APP_DB_OWNER_PASSWORD:electriplan}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=electriplan
spring.flyway.default-schema=electriplan
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,modulith

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

server.error.include-message=always

# Hibernate (Spring Data JPA). Flyway owns the schema; Hibernate only checks
# that every entity matches the table it maps, and refuses to start if not.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=electriplan


# The API's description (OpenAPI document and Swagger UI): see api-docs.properties,
# shared with the tests so they check the document the API really serves.
spring.config.import=classpath:api-docs.properties
