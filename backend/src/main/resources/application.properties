spring.application.name=planna-api
server.port=${PORT:8080}
server.shutdown=graceful

app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:4180}

app.users.sync-enabled=${USER_SYNC_ENABLED:true}
app.users.sync-interval=${USER_SYNC_INTERVAL:PT5M}

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5433/plannasaas}
spring.datasource.username=${APP_DB_USER:plannasaas}
spring.datasource.password=${APP_DB_PASSWORD:plannasaas}
spring.datasource.hikari.pool-name=plannasaas
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=plannasaas
spring.flyway.default-schema=plannasaas
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,modulith

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

server.error.include-message=always
