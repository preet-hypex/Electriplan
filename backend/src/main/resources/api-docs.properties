# The API's description (springdoc): the OpenAPI document and Swagger UI, both
# open without a sign-in. Set API_DOCS_ENABLED=false to turn both off.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.path=/api/docs/openapi.json
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
